appId: com.deepebike.pos
productName: DEEP E-BIKE & TOY POS
copyright: Copyright © 2026 DEEP E-BIKE & TOY

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - ../server/dist/**/*
  - ../server/prisma/**/*
  - ../server/node_modules/**/*
  - ../client/dist/**/*

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DEEP E-BIKE POS
  installerLanguages:
    - en_US
